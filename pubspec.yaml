name: notimemo
description: "알림에 메모를 고정하는 앱"
publish_to: 'none'
version: 2.6.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # 글 길게 눌렀을 때 뜨는 복사/붙여넣기 등을 기기 언어로 보이게 하는 번역 모음
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.0
  permission_handler: ^12.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # 홈 화면 아래 문구에 쓰는 손글씨체(Caveat, SIL Open Font License)
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/Caveat.ttf
